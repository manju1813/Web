<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>SignUp</legend>
            <label  for="email">Enter Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email">
            <br><br>
            <label  for="username">Enter username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your name">
            <br><br>
            <label  for="password">Enter Password:</label>
            <input type="password" id="pass" name="password" placeholder="*********">
            <br><br>
            <label  for="pno">Enter Phone No:</label>
            <input type="tel" minlength="10" maxlength="10" id="pno" name="pno" placeholder="10 digit no">
            <br><br>
            <label  for="age">Enter Age:</label>
            <input type="number" id="age" name="age" placeholder="24">
            <br><br>
            <label  for="dob">Enter Date of Birth:</label>
            <input type="date" id="dob" name="dob" placeholder="Enter your DOB">
            <br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </fieldset>
    </form>
</body>
<script src="./script/Register.js"></script>
</html>
