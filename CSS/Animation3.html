<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 400px;
            width: 400px;
            border: 2px solid ;
            position: relative;
        }
        section aside{
            height: 100px;
            width: 100px;
            background-color: red;
            position: absolute;
            top: 0;
            left: 0;
            animation: task3 10s linear 1s infinite;
        }

        @keyframes task3 {
            0%{
                top: 0;
                left: 0;
            }
            25%{
                top: 0;
                left: 300px;
                background-color: blue;
            }
            50%{
                left: 300px;
                top: 300px;
                background-color: orangered;
                border-radius: 50%;
            }
            75%{
                left: 0;
                top: 300px;
                background-color: blueviolet;
            }
            100%{
                top: 0;
                left: 0;
            }
        }
    </style>
</head>
<body>
    <section>
        <aside></aside>
    </section>
</body>
</html>
