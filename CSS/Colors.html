<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 400px;
            width:  400px;
            border: 3px solid brown;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-evenly;
        }
        section aside{
           height: 100px;
           width: 100px;
           border: 2px solid black;
        }
        #box1{
            background-color: aqua;
        }
        #box2{
            background-color: #101010;
        }
        #box3{
            background-color: rgb(206,4,172);
        }
        #box4{
            background-color: rgba(red, green, blue, alpha)
        }
    </style>
</head>
<body>
    <section>
        <aside id="box1"></aside>
        <aside id="box2"></aside>
        <aside id="box3"></aside>
        <aside id="box4"></aside>
        <aside id="box5"></aside>
        <aside id="box6"></aside>
    </section>
</body>
</html>
