<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=table, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <fieldset>
            <label  for="id">Id</label>
            <input type="number" id="id" name="id" placeholder="Enter your id">
            <br><br>
            <label  for="name">Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name">
            <br><br>
            <label  for="Age">Age</label>
            <input type="number" id="Age" name="Age" placeholder="Enter your Age">
            <br><br>
            <label  for="pno">Phone</label>
            <input type="number" id="pno" name="phone" minlength="10" maxlength="10" placeholder="Enter your phone no">
            <br><br>
            <label  for="Address">Address</label>
            <textarea name="address" id="address" cols="30" rows="10" placeholder="Enter your Address"></textarea>
            <br><br>
            <button type="submit">Submit</button>
        </fieldset>  
    </form>
    <table border="1">
        <thead>
            <th>Id</th>
            <th>Name</th>
            <th>Age</th>
            <th>Phone</th>
            <th>Address</th>
        </thead>
        <tbody>

        </tbody>
    </table>
</body>
<script  src="display.js"></script>
</html>
