<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .navbar{
            height: 70px;
            width: 100%;
            background-color: skyblue;
            display: flex;
        }
        .logo{
            height: 70px;
            flex-basis: 15%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo img{
            height: 60px;
            width: 60px;
            border-radius: 50%;
        }
        .menu{
            height: 70px;
            flex-basis: 85%;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }
        .menu a{
            color: aliceblue;
            font-size: 22px;
            text-decoration: none;
        }
        .menu a:hover{
            border-bottom: 2px solid black;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <aside class="logo">
            <img src="https://th.bing.com/th/id/OIP.Sc-pGDkmKH6dLZgbWk-3uAHaHa?w=197&h=197&c=7&r=0&o=7&dpr=1.3&pid=1.7&rm=3" alt="">
        </aside>
        <aside class="menu">
            <a href="#">Home page</a>
            <a href="#">Contact Us</a>
            <a href="#">About Us</a>
            <a href="#">Login</a>
            <a href="#">Register</a>
        </aside>
    </nav>
</body>
</html>
