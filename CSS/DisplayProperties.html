<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            display: inline;
            height: 150px;
            width: 500px;
            border: 2px solid red;
        }
        b{
            display: block;
            height: 150px;
            width: 500px;
            border: 2px solid magenta;
        }

        i{
            display: inline-block;
            height: 500px;
            width: 500px;
            border: 2px solid greenyellow;
        }
        
    </style>
</head>
<body>
    <h1>Sakshi BRO</h1>
<br><br>
    <b>Sakshi Bro</b>
    <br><br>
    <i>Balaji</i>
</body>
</html>
