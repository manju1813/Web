<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body bgcolor="#0A5A6A" text="white">
    <center>
        <h1>Application Form</h1>
    <br>
    <table cellpadding="10">
        <tr>
            <td><font size="5">First Name:</font></td>
            <td><input type="text"></td>
            <td><font size="5">Last Name:</font></td>
            <td><input type="text"></td>
        </tr>    
             <tr>
                <td ><font size="5">Date Of Birth:</font></td>
                <td><input type="date"></td>
                <td><font size="5">Age:</font></td>
                <td><input type="number"></td>
            </tr>
            <tr>
                <td><font size="5">Gender:</font></td>
                <td>
                    <select name="gender" id="gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Others">Others</option>
                    </select>
                 </td>
                 <td><font size="5">Email Address:</font></td>
                 <td><input type="email" placeholder="Enter email address"></td>
            </tr>
            <tr>
                 <td><font size="5">Positions Available:</font></td>
                 <td colspan="3">
                    <font size="5">
                    <input type="radio">Junior Developer
                    <input type="radio">Mid-level Developer
                    <input type="radio">Senior Developer
                    </font>
                 </td>
            </tr>
            <tr>
                <td><font size="5">Programming Languages:</font></td>
                <td colspan="3">
                    <font size="5">
                    <input type="checkbox">Java
                    <input type="checkbox">JavaScript
                    <input type="checkbox">Python
                    </font>
                 </td>
            </tr>
            <tr>
                <td><font size="5">Password:</font></td>
                <td><input type="password"></td>
                <td><font size="5">Confirm Password:</font></td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td colspan="5" align="center">
                    <button style="background-color: orange; color: white; width: 100px;"><font size="4">Submit</font></button>
                    <button style="background-color: orange; color: white; width: 100px;"><font size="4">Reset</font></button>
                </td>
    </table>
    </center>
</body>
</html>
