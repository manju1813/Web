<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section{
            height: 400px;
            width: 500px;
            border: 2px solid red;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly;
        }

        section div{
            font-size: 25px;
            position: relative;
            animation: task4 5s 1s infinite;
        }
        div:first-child{
            animation-timing-function: ease;
        }
        div:nth-child(2){
            animation-timing-function: ease-in;
        }
        div:nth-child(3){
            animation-timing-function: ease-in-out;
        }
        div:nth-child(4){
            animation-timing-function: ease-out;
        }
        div:last-child{
            animation-timing-function: linear;
        }
        @keyframes task4 {
            0%{
                left: 0;
            }
            100%{
                left: 80%;
            }
        }
    </style>
</head>
<body>
    <section>
        <div>😈 ease</div>
        <div>💀 ease-in</div>
        <div>😎 ease-in-out</div>
        <div>👻 ease-out</div>
        <div>👺 linear</div>
    </section>
</body>
</html>
