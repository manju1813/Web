<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        section {
            height: 400px;
            width: 400px;
            border-width: 10px;
            border-style: solid;
            border-color: brown;
            display: flex;
            align-items: center;
            justify-content: space-evenly;
            flex-wrap: wrap;
        }

        aside {
            height: 100px;
            width: 100px;
        }

        #box1 {
            border: 2px solid red;
        }

        #box2 {
            border: 8px double black;
            border-radius: 50%;

        }

        #box3 {
            border: 5px dotted green;
        }

        #box4 {
            border: 5px dashed pink;
            border-radius: 50%;

        }

        #box5 {
            border: 5px groove blueviolet;
        }

        #box6 {
            border: 5px ridge blueviolet;
            border-top-left-radius: 20px;
            border-top-right-radius: 50px;
            border-bottom-left-radius: 80px;
            border-bottom-right-radius: 30px;
        }
        #box7{
            border-top: 2px solid purple;
            border-bottom: 5px dashed red;
            border-right: 8px dotted yellow;
            border-left: 10px double aqua;
        }
    </style>
</head>

<body>
    <section>
        <aside id="box1"></aside>
        <aside id="box2"></aside>
        <aside id="box3"></aside>
        <aside id="box4"></aside>
        <aside id="box5"></aside>
        <aside id="box6"></aside>
        <aside id="box7"></aside>
        <aside id="box8"></aside>
    </section>
</body>

</html>
